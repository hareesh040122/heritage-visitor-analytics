# Netlify Configuration for Heritage Visitor Analytics Frontend

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://heritage-visitor-analytics-api.onrender.com"
